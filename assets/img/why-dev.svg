<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" role="img" aria-label="Software development illustration">
  <defs>
    <filter id="ws" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <linearGradient id="wbadge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0726b"/><stop offset="1" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>

  <!-- soft blob -->
  <path d="M150 70 C80 95 45 200 95 285 C140 360 300 385 405 340 C495 302 500 190 452 115 C405 42 235 40 150 70 Z"
        fill="#f6eef0" opacity="0.9"/>

  <!-- editor window -->
  <g filter="url(#ws)">
    <rect x="96" y="118" width="330" height="212" rx="16" fill="#ffffff"/>
  </g>
  <rect x="96" y="118" width="330" height="42" rx="16" fill="#f4eeef"/>
  <rect x="96" y="146" width="330" height="14" fill="#f4eeef"/>
  <circle cx="120" cy="139" r="5.5" fill="#e2231a"/>
  <circle cx="138" cy="139" r="5.5" fill="#d9d3d3"/>
  <circle cx="156" cy="139" r="5.5" fill="#d9d3d3"/>
  <rect x="300" y="132" width="104" height="14" rx="7" fill="#efe7e7"/>

  <!-- code lines -->
  <g>
    <rect x="120" y="182" width="40"  height="9" rx="4.5" fill="#e2231a"/>
    <rect x="168" y="182" width="90"  height="9" rx="4.5" fill="#cdd3da"/>
    <rect x="140" y="204" width="60"  height="9" rx="4.5" fill="#9ca3af"/>
    <rect x="208" y="204" width="120" height="9" rx="4.5" fill="#e9c3c1"/>
    <rect x="140" y="226" width="34"  height="9" rx="4.5" fill="#16a34a"/>
    <rect x="182" y="226" width="70"  height="9" rx="4.5" fill="#cdd3da"/>
    <rect x="120" y="248" width="54"  height="9" rx="4.5" fill="#e2231a"/>
    <rect x="182" y="248" width="150" height="9" rx="4.5" fill="#cdd3da"/>
    <rect x="140" y="270" width="96"  height="9" rx="4.5" fill="#9ca3af"/>
    <rect x="120" y="292" width="40"  height="9" rx="4.5" fill="#e2231a"/>
  </g>

  <!-- floating </> badge -->
  <g filter="url(#ws)" transform="translate(360,86)">
    <rect x="0" y="0" width="72" height="72" rx="18" fill="url(#wbadge)"/>
    <path d="M28 26 L18 36 L28 46" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M44 26 L54 36 L44 46" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- floating small card { } -->
  <g filter="url(#ws)" transform="translate(70,300)">
    <rect x="0" y="0" width="86" height="58" rx="14" fill="#ffffff"/>
    <text x="43" y="38" text-anchor="middle" font-family="'Poppins',Arial,sans-serif" font-size="26" font-weight="800" fill="#e2231a">{ }</text>
  </g>

  <!-- accent dots -->
  <circle cx="440" cy="300" r="9" fill="#e2231a" opacity="0.85"/>
  <circle cx="74" cy="150" r="6" fill="#e2231a" opacity="0.5"/>
</svg>
