<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" fill="none" role="img" aria-label="Laptop displaying an analytics dashboard">
  <defs>
    <linearGradient id="lp-screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20242e"/>
      <stop offset="1" stop-color="#12141b"/>
    </linearGradient>
    <linearGradient id="lp-bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#b91c1c"/>
      <stop offset="1" stop-color="#f0726b"/>
    </linearGradient>
    <linearGradient id="lp-deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef1f6"/>
      <stop offset="1" stop-color="#c3cad5"/>
    </linearGradient>
    <style>
      .bar    { transform-box: fill-box; transform-origin: bottom center; animation: lp-grow 2.8s ease-in-out infinite; }
      .bar.b2 { animation-delay: .25s } .bar.b3 { animation-delay: .5s } .bar.b4 { animation-delay: .75s } .bar.b5 { animation-delay: 1s }
      .spark  { stroke-dasharray: 260; stroke-dashoffset: 260; animation: lp-draw 3.2s ease-in-out infinite; }
      .stat   { animation: lp-blink 1.8s ease-in-out infinite; }
      @keyframes lp-grow  { 0%,100% { transform: scaleY(.5); } 50% { transform: scaleY(1); } }
      @keyframes lp-draw  { 0% { stroke-dashoffset: 260; } 60%,100% { stroke-dashoffset: 0; } }
      @keyframes lp-blink { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
      @media (prefers-reduced-motion: reduce) {
        .bar, .spark, .stat { animation: none; }
        .bar { transform: none; }
        .spark { stroke-dashoffset: 0; }
      }
    </style>
  </defs>

  <!-- Screen -->
  <rect x="88" y="24" width="384" height="256" rx="18" fill="#0e1016"/>
  <rect x="100" y="36" width="360" height="232" rx="11" fill="url(#lp-screen)"/>

  <!-- Window chrome -->
  <circle cx="120" cy="56" r="4.5" fill="#e2231a"/>
  <circle cx="136" cy="56" r="4.5" fill="#39404d"/>
  <circle cx="152" cy="56" r="4.5" fill="#39404d"/>
  <rect x="326" y="50" width="112" height="12" rx="6" fill="#242a37"/>
  <circle class="stat" cx="448" cy="56" r="4.5" fill="#22c55e"/>

  <!-- KPI block -->
  <rect x="120" y="84" width="58" height="12" rx="6" fill="#e2231a"/>
  <rect x="120" y="104" width="150" height="22" rx="6" fill="#2b313f"/>
  <rect x="120" y="134" width="96" height="9" rx="4.5" fill="#242a37"/>

  <!-- Spark line -->
  <polyline class="spark" points="300,150 336,120 372,138 408,96 442,112"
            fill="none" stroke="#f0726b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="stat" cx="442" cy="112" r="5" fill="#f0726b"/>

  <!-- Bars -->
  <rect class="bar b1" x="120" y="176" width="42" height="72" rx="7" fill="url(#lp-bar)"/>
  <rect class="bar b2" x="186" y="176" width="42" height="72" rx="7" fill="url(#lp-bar)"/>
  <rect class="bar b3" x="252" y="176" width="42" height="72" rx="7" fill="url(#lp-bar)"/>
  <rect class="bar b4" x="318" y="176" width="42" height="72" rx="7" fill="url(#lp-bar)"/>
  <rect class="bar b5" x="384" y="176" width="42" height="72" rx="7" fill="url(#lp-bar)"/>

  <!-- Laptop deck / base -->
  <path d="M60 280 h440 l40 40 H20 z" fill="url(#lp-deck)"/>
  <rect x="20" y="320" width="520" height="10" rx="5" fill="#aeb6c2"/>
  <rect x="238" y="288" width="84" height="8" rx="4" fill="#b9c0cb"/>
</svg>
