<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" role="img" aria-label="ECL — Expected Credit Loss illustration">
  <defs>
    <linearGradient id="eclBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b2b30"/>
      <stop offset="100%" stop-color="#141417"/>
    </linearGradient>
    <linearGradient id="eclAccent" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#e2231a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#f0726b" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="eclBar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#52525b"/>
      <stop offset="100%" stop-color="#9ca3af"/>
    </linearGradient>
  </defs>
  <rect width="520" height="420" rx="22" fill="url(#eclBg)"/>

  <!-- subtle grid -->
  <g opacity="0.18" stroke="#ffffff" stroke-width="1">
    <line x1="60"  y1="340" x2="480" y2="340"/>
    <line x1="60"  y1="280" x2="480" y2="280"/>
    <line x1="60"  y1="220" x2="480" y2="220"/>
    <line x1="60"  y1="160" x2="480" y2="160"/>
    <line x1="60"  y1="100" x2="480" y2="100"/>
  </g>

  <!-- bars (loss provisions over stages) -->
  <g>
    <rect x="100" y="250" width="48" height="90"  rx="4" fill="url(#eclBar)"/>
    <rect x="170" y="200" width="48" height="140" rx="4" fill="url(#eclBar)"/>
    <rect x="240" y="160" width="48" height="180" rx="4" fill="url(#eclBar)"/>
    <rect x="310" y="120" width="48" height="220" rx="4" fill="url(#eclBar)"/>
    <rect x="380" y="80"  width="48" height="260" rx="4" fill="url(#eclBar)"/>
  </g>

  <!-- expected-loss curve -->
  <path d="M70 320 C 140 300, 200 250, 260 200 S 380 110, 470 60"
        fill="none" stroke="url(#eclAccent)" stroke-width="6" stroke-linecap="round"/>
  <!-- curve endpoint marker -->
  <circle cx="470" cy="60" r="9" fill="#e2231a" stroke="#ffffff" stroke-width="3"/>
  <circle cx="70"  cy="320" r="6" fill="#e2231a" opacity="0.8"/>

  <!-- baseline -->
  <line x1="60" y1="340" x2="480" y2="340" stroke="#ffffff" stroke-width="2" opacity="0.6"/>

  <!-- caption -->
  <text x="60" y="385" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700"
        fill="#ffffff" opacity="0.7" letter-spacing="3">STAGE 1 &#8212; STAGE 2 &#8212; STAGE 3</text>
</svg>
