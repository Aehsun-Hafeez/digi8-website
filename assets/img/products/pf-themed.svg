<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Provident Fund savings growth">
  <defs>
    <linearGradient id="pfbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdeceb"/>
      <stop offset="1" stop-color="#fbf7f7"/>
    </linearGradient>
    <linearGradient id="pfcoin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0726b"/>
      <stop offset="1" stop-color="#e2231a"/>
    </linearGradient>
  </defs>
  <rect width="480" height="360" fill="url(#pfbg)"/>
  <!-- card -->
  <rect x="54" y="56" width="372" height="212" rx="16" fill="#ffffff" stroke="#efe7e7"/>

  <!-- growth arrow -->
  <polyline points="92,210 168,176 236,182 322,116" fill="none" stroke="#1f2937" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M300 112 L326 110 L322 136 Z" fill="#1f2937"/>

  <!-- coin stacks (growing) -->
  <g>
    <ellipse cx="116" cy="232" rx="26" ry="9" fill="url(#pfcoin)"/>
    <rect x="90" y="216" width="52" height="16" fill="url(#pfcoin)"/>
    <ellipse cx="116" cy="216" rx="26" ry="9" fill="#f0726b"/>
  </g>
  <g>
    <ellipse cx="196" cy="232" rx="26" ry="9" fill="url(#pfcoin)"/>
    <rect x="170" y="200" width="52" height="32" fill="url(#pfcoin)"/>
    <ellipse cx="196" cy="200" rx="26" ry="9" fill="#f0726b"/>
  </g>
  <g>
    <ellipse cx="276" cy="232" rx="26" ry="9" fill="url(#pfcoin)"/>
    <rect x="250" y="184" width="52" height="48" fill="url(#pfcoin)"/>
    <ellipse cx="276" cy="184" rx="26" ry="9" fill="#f0726b"/>
    <text x="276" y="190" font-family="Poppins,Arial,sans-serif" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">%</text>
  </g>
  <g>
    <ellipse cx="356" cy="232" rx="26" ry="9" fill="url(#pfcoin)"/>
    <rect x="330" y="160" width="52" height="72" fill="url(#pfcoin)"/>
    <ellipse cx="356" cy="160" rx="26" ry="9" fill="#f0726b"/>
  </g>

  <!-- member badge -->
  <g transform="translate(330,70)">
    <circle cx="28" cy="28" r="26" fill="#fff" stroke="#e2231a" stroke-width="3"/>
    <circle cx="28" cy="22" r="9" fill="#e2231a"/>
    <path d="M11 44c2-10 9-15 17-15s15 5 17 15z" fill="#e2231a"/>
  </g>

  <text x="74" y="302" font-family="Poppins,Arial,sans-serif" font-size="17" font-weight="700" fill="#1f2937">Provident Fund</text>
  <text x="74" y="324" font-family="Poppins,Arial,sans-serif" font-size="12.5" fill="#9b8f8f">Contributions, profit &amp; settlements</text>
</svg>
